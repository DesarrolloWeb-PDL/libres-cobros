schema: spec-driven

context: |
  Tech stack: Next.js 14+ (App Router), Prisma, PostgreSQL, TypeScript, Tailwind CSS.
  Deploy target: Vercel.
  Project type: Greenfield club fee management system (libres-cobros).
  Architecture: Fee-First (pre-generate monthly fees, then attach payments).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns from Tiempo Bakery where applicable
      - Keep admin and member portals in separate route groups
    tdd: false
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

# Auto-merge Dependabot PATCH updates for production dependencies.
#
# Requires repo setting: Settings → General → "Allow auto-merge" enabled.
# Without it, `gh pr merge --auto` fails and the PR stays open for manual merge.
name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Only auto-merge semver-patch updates of production dependencies.
      # Minors and majors always need human review.
      - name: Enable auto-merge for production patches
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.metadata.outputs.dependency-type == 'direct:production'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

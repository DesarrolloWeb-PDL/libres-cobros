<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Sin conexión — Libres Cobros</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f8f9fb;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .container {
        max-width: 360px;
      }
      .icon {
        width: 80px;
        height: 80px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
      }
      .icon svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #6b7280;
        line-height: 1.5;
      }
      button {
        background: #7c3aed;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.625rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="offlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7c3aed"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="14" height="14" rx="2.5" fill="url(#offlineGrad)" opacity="1"/>
          <rect x="18" y="0" width="14" height="14" rx="2.5" fill="url(#offlineGrad)" opacity="0.7"/>
          <rect x="0" y="18" width="14" height="14" rx="2.5" fill="url(#offlineGrad)" opacity="0.5"/>
          <rect x="18" y="18" width="14" height="14" rx="2.5" fill="url(#offlineGrad)" opacity="0.3"/>
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar el portal. Verificá tu conexión a internet y volvé a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>

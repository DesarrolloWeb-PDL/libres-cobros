<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Sin conexión — Libres Cobros</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #f8f9fb;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      .container {
        max-width: 360px;
      }
      .icon {
        width: 80px;
        height: 80px;
        background: #7c3aed;
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #6b7280;
        line-height: 1.5;
      }
      button {
        background: #7c3aed;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.625rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">LC</div>
      <h1>Sin conexión</h1>
      <p>No pudimos cargar el portal. Verificá tu conexión a internet y volvé a intentarlo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>

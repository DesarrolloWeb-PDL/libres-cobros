<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#f8f9fb" stroke="#d1d5db" stroke-width="1"/>
  
  <!-- Invoice/document shape -->
  <rect x="8" y="4" width="16" height="24" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  
  <!-- Top line (header) -->
  <line x1="11" y1="9" x2="21" y2="9" stroke="#d1d5db" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Dollar/peso symbol -->
  <text x="16" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#374151" text-anchor="middle" dominant-baseline="middle">$</text>
  
  <!-- Bottom lines -->
  <line x1="11" y1="22" x2="17" y2="22" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="11" y1="25" x2="15" y2="25" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
</svg>
